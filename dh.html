<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jawor.ai - Chat Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #01643d;
            --bg-light: #f4f5f4;
            --text-dark: #333;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 80vh;
            overflow: hidden;
        }
        .chat-header {
            background-color: var(--primary);
            color: #fff;
            padding: 15px;
            text-align: center;
            font-weight: 600;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.user {
            background-color: var(--primary);
            color: #fff;
            align-self: flex-end;
        }
        .message.bot {
            background-color: var(--bg-light);
            color: var(--text-dark);
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            background: #fff;
            gap: 10px;
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
        }
        .file-upload-label {
            background-color: #e0e4e0;
            color: var(--primary);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .file-upload-label input[type="file"] {
            display: none;
        }
        .send-btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .file-indicator {
            font-size: 11px;
            color: #666;
            margin-top: -5px;
            margin-bottom: 10px;
            padding: 0 15px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Jawor.ai Asystent</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">Dzień dobry! W czym mogę pomóc? Możesz dołączyć plik dokumentu (np. doc, docx, pdf).</div>
    </div>
    
    <div class="file-indicator" id="fileIndicator">Brak wybranego pliku.</div>
    
    <div class="chat-input-area">
        <label class="file-upload-label">
            📎
            <!-- Obsługa plików m m.in. doc, docx, pdf -->
            <input type="file" id="fileInput" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.pdf">
        </label>
        <input type="text" id="chatInput" placeholder="Wpisz wiadomość..." onkeypress="handleEnter(event)">
        <button class="send-btn" onclick="sendMessage()">Wyślij</button>
    </div>
</div>

<script>
    const N8N_WEBHOOK_URL = 'TUTAJ_ADRES_TWOJEGO_WEBHOOKA'; // <-- Zmień na swój webhook z n8n
    const fileInput = document.getElementById('fileInput');
    const fileIndicator = document.getElementById('fileIndicator');

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            fileIndicator.textContent = `Wybrano plik: ${fileInput.files[0].name}`;
        } else {
            fileIndicator.textContent = `Brak wybranego pliku.`;
        }
    });

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const inputField = document.getElementById('chatInput');
        const text = inputField.value.trim();
        const file = fileInput.files[0];

        if (!text && !file) return;

        const chatMessages = document.getElementById('chatMessages');
        
        // Dodaj wiadomość użytkownika do widoku
        let userMsg = text;
        if (file) userMsg += `<br><i>📎 Dołączono plik: ${file.name}</i>`;
        chatMessages.innerHTML += `<div class="message user">${userMsg || '<i>Przesłano plik</i>'}</div>`;
        
        inputField.value = '';
        fileIndicator.textContent = 'Brak wybranego pliku.';
        
        // Utwórz FormData do wysłania tekstu i pliku
        const formData = new FormData();
        formData.append('chatInput', text);
        formData.append('sessionId', localStorage.getItem('jawor_session') || 'sesja_' + Date.now());
        if (file) {
            formData.append('attachment', file);
        }

        // Czyść input pliku po załadowaniu do formularza
        fileInput.value = '';

        // Komunikat ładowania
        const loaderId = 'loader_' + Date.now();
        chatMessages.innerHTML += `<div id="${loaderId}" class="message bot">Przetwarzanie...</div>`;
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                body: formData // Wysyłamy jako multipart/form-data
            });

            const data = await response.json();
            const loader = document.getElementById(loaderId);
            if (loader) {
                // Załóżmy, że odpowiedź z n8n wraca w polu 'output'
                loader.innerHTML = data.output || "Otrzymano odpowiedź, ale format jest nierozpoznany.";
            }
        } catch (error) {
            console.error('Błąd:', error);
            const loader = document.getElementById(loaderId);
            if (loader) loader.innerHTML = "Wystąpił błąd komunikacji z agentem n8n.";
        }
        
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    // Zapisz sesję, aby n8n miał ciągłość konwersacji
    if (!localStorage.getItem('jawor_session')) {
        localStorage.setItem('jawor_session', 'sesja_' + Math.random().toString(36).substr(2, 9));
    }
</script>

</body>
</html>
